    .w1 { animation: drift 14s linear infinite; }
    .w2 { animation: drift 9s linear infinite reverse; }
    .w3 { animation: drift 6s linear infinite; }
    .ray { transform-origin: 440px 150px; animation: spin 60s linear infinite; }
    .swing { transform-origin: 0 -26px; animation: swing 3.6s ease-in-out infinite; }
    .swing2 { transform-origin: 0 -26px; animation: swing 3.6s ease-in-out -1.8s infinite; }
