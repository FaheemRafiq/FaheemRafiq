<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-label="Kasugai crow dispatch: head to production, a bug has been devouring users every night">
  <defs>
    <pattern id="ichi" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#141414"/>
      <rect width="20" height="20" fill="#2f8f6b"/><rect x="20" y="20" width="20" height="20" fill="#2f8f6b"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3e7cc"/><stop offset="1" stop-color="#e6d3a8"/></linearGradient>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101728"/><stop offset="1" stop-color="#2a1f3d"/></linearGradient>
  </defs>
  <style>
    .s { font-family: Georgia,'Times New Roman','Noto Serif',serif; fill: #2a211c; }
    .b { font-weight: 700; }
    .caw { font-family: Georgia,'Times New Roman','Noto Serif',serif; font-weight: 700; fill: #c8102e; animation: caw 1.1s steps(2, start) infinite; }
    .bob { transform-origin: 150px 300px; animation: bob 1.1s ease-in-out infinite; }
    .beak { transform-origin: 196px 196px; animation: beak 1.1s ease-in-out infinite; }
    .moon { animation: glow 4s ease-in-out infinite; }
    @keyframes caw { to { visibility: hidden } }
    @keyframes bob { 0%,100% { transform: rotate(-3deg) } 50% { transform: rotate(4deg) } }
    @keyframes beak { 0%,100% { transform: rotate(0deg) } 50% { transform: rotate(16deg) } }
    @keyframes glow { 0%,100% { opacity: .85 } 50% { opacity: 1 } }
  </style>
  <rect width="880" height="440" fill="url(#dusk)"/>
  <rect x="0" y="0" width="880" height="12" fill="url(#ichi)"/><rect x="0" y="428" width="880" height="12" fill="url(#ichi)"/>
  <circle class="moon" cx="96" cy="92" r="46" fill="#f6edc9"/>
  <circle cx="116" cy="78" r="44" fill="#111a2c"/>
  <!-- perch -->
  <path d="M20 318 C90 300 190 322 290 306" stroke="#3b2a20" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M230 311 l34 -30 m-70 34 l-20 26" stroke="#3b2a20" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- crow -->
  <g class="bob">
    <path d="M70 300 C40 262 66 206 126 200 C176 195 214 232 206 274 C200 304 160 316 122 312 Z" fill="#0c0c10"/>
    <path d="M78 296 C40 318 22 348 14 372 C48 356 86 338 112 312 Z" fill="#0c0c10"/>
    <path d="M96 250 C110 226 150 222 172 244 C160 276 124 290 96 250 Z" fill="#20202b"/>
    <circle cx="170" cy="190" r="34" fill="#0c0c10"/>
    <circle cx="180" cy="182" r="7" fill="#f6edc9"/><circle cx="182" cy="182" r="3.2" fill="#0c0c10"/>
    <path d="M196 184 L246 178 L198 198 Z" fill="#d9a441" stroke="#2a211c" stroke-width="1.2"/>
    <path class="beak" d="M196 196 L238 206 L196 208 Z" fill="#b9862f" stroke="#2a211c" stroke-width="1.2"/>
    <path d="M128 310 v14 m-8 0 h16 M158 308 v14 m-8 0 h16" stroke="#d9a441" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text class="caw" x="214" y="140" font-size="28" transform="rotate(-12 214 140)">CAW!</text>
  <!-- scroll -->
  <rect x="318" y="46" width="530" height="348" fill="url(#paper)" stroke="#2a211c" stroke-width="1.5"/>
  <rect x="310" y="36" width="546" height="16" rx="8" fill="#5b3a26"/><rect x="310" y="388" width="546" height="16" rx="8" fill="#5b3a26"/>
  <path d="M318 150 L286 172 L318 190 Z" fill="#f3e7cc" stroke="#2a211c" stroke-width="1.5"/>
  <path d="M319 153 V188" stroke="#f3e7cc" stroke-width="3"/>
  <text class="s b" x="583" y="90" text-anchor="middle" font-size="19" letter-spacing="6">KASUGAI CROW DISPATCH</text>
  <path d="M400 102 H766" stroke="#c8102e" stroke-width="2"/>
  <text class="s b" x="346" y="140" font-size="20">FAHEEM RAFIQ!</text>
  <text class="s" x="346" y="170" font-size="18">Head north-northwest! To <tspan class="b" fill="#c8102e">production!</tspan></text>
  <text class="s" x="346" y="198" font-size="18">A bug has been devouring users every night!</text>
  <path d="M346 216 H820" stroke="#2a211c" stroke-opacity=".5" stroke-dasharray="2 5"/>
  <text class="s" x="346" y="246" font-size="16">◆ Slay it before sunrise <tspan font-style="italic" fill="#8a6d3b">(the stand-up)</tspan></text>
  <text class="s" x="346" y="274" font-size="16">◆ Do not deploy on Friday. Demons hunt on Fridays.</text>
  <text class="s" x="346" y="302" font-size="16">◆ The demon's weak point is the neck <tspan font-style="italic" fill="#8a6d3b">(line 1 of the stack trace)</tspan></text>
  <text class="s" x="346" y="330" font-size="16">◆ If it regenerates, you only fixed the symptom.</text>
  <text class="s b" x="346" y="368" font-size="15" fill="#c8102e" letter-spacing="2">CAW! THAT IS AN ORDER! CAW!</text>
  <g transform="rotate(-8 792 346)" opacity=".92">
    <circle cx="792" cy="346" r="30" fill="none" stroke="#c8102e" stroke-width="4"/>
    <circle cx="792" cy="346" r="23" fill="#c8102e"/>
    <text x="792" y="356" text-anchor="middle" font-size="28" font-weight="700" fill="#f3e7cc" font-family="'Noto Serif CJK JP','Yu Mincho','Hiragino Mincho ProN','Songti SC',serif">滅</text>
  </g>
</svg>
