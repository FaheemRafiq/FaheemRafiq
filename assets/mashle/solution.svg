<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Problem, and Mash's solution: muscles. Every time.">
  <defs>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <circle cx="2.2" cy="2.2" r="1.5" fill="#1a1612" opacity=".16"/>
    </pattern>
    <pattern id="dotsg" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <circle cx="2" cy="2" r="1.5" fill="#d9a521" opacity=".55"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="corner"><rect width="100%" height="100%" fill="url(#fade)"/></mask>
  </defs>
  <style>
    .c { font-family: Impact,'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight: 900; fill: #1a1612; }
    .t { font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; fill: #1a1612; }
    .m { font-family: 'Fira Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; fill: #1a1612; }
    .bob { animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
    
    .pop { animation: pop 6s cubic-bezier(.2,1.7,.4,1) infinite both; transform-box: fill-box; transform-origin: center; }
    @keyframes pop { 0% { transform: scale(0) rotate(-20deg); opacity: 0 } 6%,100% { transform: scale(1) rotate(-6deg); opacity: 1 } }
    .arrow { animation: nudge 1.2s ease-in-out infinite; }
    @keyframes nudge { 0%,100% { transform: translateX(0) } 50% { transform: translateX(7px) } }

  </style>
  <rect x="16" y="16" width="856" height="446" fill="#d9a521"/>
  <rect x="8" y="8" width="856" height="446" fill="#f6ecd2" stroke="#1a1612" stroke-width="5"/>
  <rect x="8" y="8" width="856" height="446" fill="url(#dots)" mask="url(#corner)"/>

  <rect x="8" y="8" width="856" height="74" fill="#1a1612"/>
  <text class="c" x="48" y="56" font-size="30" letter-spacing="3" style="fill:#f6ecd2">PROBLEM</text>
  <text class="c" x="486" y="56" font-size="30" letter-spacing="3" style="fill:#d9a521">MASH'S SOLUTION</text>

  <rect x="48" y="116" width="330" height="54" fill="#fffaf0" stroke="#1a1612" stroke-width="3.5"/>
  <text class="t" x="66" y="150" font-size="18" font-weight="700">Bug in production</text>
  <g class="arrow"><path d="M396 142 h44 v-11 l24 17 l-24 17 v-11 h-44z" fill="#1a1612"/></g>
  <g class="pop" style="animation-delay:0.0s">
    <rect x="486" y="114" width="170" height="58" fill="#d9a521" stroke="#1a1612" stroke-width="4"/>
    <text class="c" x="571" y="155" text-anchor="middle" font-size="27" letter-spacing="2">MUSCLES</text>
  </g>
  <text class="m" x="676" y="148" font-size="12" opacity=".8">git revert</text>
  <text class="m" x="676" y="164" font-size="12" opacity=".8">but firmly</text>
  <rect x="48" y="188" width="330" height="54" fill="#fffaf0" stroke="#1a1612" stroke-width="3.5"/>
  <text class="t" x="66" y="222" font-size="18" font-weight="700">The query takes 40 seconds</text>
  <g class="arrow"><path d="M396 214 h44 v-11 l24 17 l-24 17 v-11 h-44z" fill="#1a1612"/></g>
  <g class="pop" style="animation-delay:0.5s">
    <rect x="486" y="186" width="170" height="58" fill="#d9a521" stroke="#1a1612" stroke-width="4"/>
    <text class="c" x="571" y="227" text-anchor="middle" font-size="27" letter-spacing="2">MUSCLES</text>
  </g>
  <text class="m" x="676" y="220" font-size="12" opacity=".8">an index</text>
  <text class="m" x="676" y="236" font-size="12" opacity=".8">added with force</text>
  <rect x="48" y="260" width="330" height="54" fill="#fffaf0" stroke="#1a1612" stroke-width="3.5"/>
  <text class="t" x="66" y="294" font-size="18" font-weight="700">Merge conflict</text>
  <g class="arrow"><path d="M396 286 h44 v-11 l24 17 l-24 17 v-11 h-44z" fill="#1a1612"/></g>
  <g class="pop" style="animation-delay:1.0s">
    <rect x="486" y="258" width="170" height="58" fill="#d9a521" stroke="#1a1612" stroke-width="4"/>
    <text class="c" x="571" y="299" text-anchor="middle" font-size="27" letter-spacing="2">MUSCLES</text>
  </g>
  <text class="m" x="676" y="292" font-size="12" opacity=".8">both sides</text>
  <text class="m" x="676" y="308" font-size="12" opacity=".8">flexed into one</text>
  <rect x="48" y="332" width="330" height="54" fill="#fffaf0" stroke="#1a1612" stroke-width="3.5"/>
  <text class="t" x="66" y="366" font-size="18" font-weight="700">The door says "pull"</text>
  <g class="arrow"><path d="M396 358 h44 v-11 l24 17 l-24 17 v-11 h-44z" fill="#1a1612"/></g>
  <g class="pop" style="animation-delay:1.5s">
    <rect x="486" y="330" width="170" height="58" fill="#d9a521" stroke="#1a1612" stroke-width="4"/>
    <text class="c" x="571" y="371" text-anchor="middle" font-size="27" letter-spacing="2">MUSCLES</text>
  </g>
  <text class="m" x="676" y="364" font-size="12" opacity=".8">there is no longer</text>
  <text class="m" x="676" y="380" font-size="12" opacity=".8">a door</text>
  <text class="t" x="436.0" y="430" text-anchor="middle" font-size="15" font-style="italic">(spoken with no change in facial expression)</text>

</svg>
