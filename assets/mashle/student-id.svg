    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="corner"><rect width="100%" height="100%" fill="url(#fade)"/></mask>
  </defs>
  <style>
    .c { font-family: Impact,'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight: 900; fill: #1a1612; }
    .t { font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; fill: #1a1612; }
    .m { font-family: 'Fira Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; fill: #1a1612; }
    .bob { animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
    
    .g { transform-box: fill-box; transform-origin: left; animation: grow 1.4s cubic-bezier(.2,.8,.2,1) both; }
    .g0 { animation-delay: 0.0s } .g1 { animation-delay: 0.2s } .g2 { animation-delay: 0.4s } .g3 { animation-delay: 0.6s } .g4 { animation-delay: 0.8s } 
    @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    .stamp { animation: stamp 4s cubic-bezier(.2,1.8,.4,1) infinite; transform-origin: 730px 132px; }
    @keyframes stamp { 0% { transform: scale(2.2) rotate(-14deg); opacity: 0 } 10%,100% { transform: scale(1) rotate(-14deg); opacity: .9 } }
    .blink { animation: blink 4.5s infinite; transform-origin: 160px 232px; }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }

  </style>
