<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" width="880" height="550" role="img" aria-label="STATUS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071230"/>
      <stop offset="1" stop-color="#030816"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc9ff" stop-opacity="0"/>
      <stop offset=".12" stop-color="#4cc9ff"/>
      <stop offset=".88" stop-color="#4cc9ff"/>
      <stop offset="1" stop-color="#4cc9ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#4cc9ff" opacity=".05"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <style>
    .t { font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; fill: #e8f6ff; }
    .m { font-family: 'Fira Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; fill: #e8f6ff; }
    .dim { fill: #8fb6dc; }
    .acc { fill: #4cc9ff; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    .blink { animation: blink 1.4s steps(2, start) infinite; }
    .sweep { animation: sweep 5s linear infinite; }
    @keyframes pulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
    @keyframes blink { to { visibility: hidden } }
    @keyframes sweep { from { transform: translateY(-40px) } to { transform: translateY(550px) } }
    @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
    .g0 { transform-box: fill-box; transform-origin: left; animation: grow 1.6s 0.00s cubic-bezier(.2,.8,.2,1) both; }
    .g1 { transform-box: fill-box; transform-origin: left; animation: grow 1.6s 0.25s cubic-bezier(.2,.8,.2,1) both; }
    .g2 { transform-box: fill-box; transform-origin: left; animation: grow 1.6s 0.50s cubic-bezier(.2,.8,.2,1) both; }
    .g3 { transform-box: fill-box; transform-origin: left; animation: grow 1.6s 0.75s cubic-bezier(.2,.8,.2,1) both; }
    .g4 { transform-box: fill-box; transform-origin: left; animation: grow 1.6s 1.00s cubic-bezier(.2,.8,.2,1) both; }
    
  </style>
  <rect x="14" y="14" width="852" height="522" fill="url(#bg)" stroke="#4cc9ff" stroke-opacity=".55" stroke-width="1.2"/>
  <rect x="14" y="14" width="852" height="522" fill="url(#scan)"/>
  <rect class="sweep" x="14" y="0" width="852" height="40" fill="#4cc9ff" opacity=".035"/>
  <g class="pulse">
    <rect x="0" y="9" width="880" height="12" fill="url(#bar)" filter="url(#soft)" opacity=".8"/>
    <rect x="0" y="529" width="880" height="12" fill="url(#bar)" filter="url(#soft)" opacity=".8"/>
  </g>
  <rect x="0" y="12" width="880" height="4" fill="url(#bar)"/>
  <rect x="0" y="534" width="880" height="4" fill="url(#bar)"/>
  <g filter="url(#glow)">
    <rect x="290.0" y="38" width="300" height="40" fill="#071230" fill-opacity=".6" stroke="#4cc9ff" stroke-width="1.4"/>
    <circle cx="318.0" cy="58" r="12" fill="none" stroke="#e8f6ff" stroke-width="1.6"/>
    <text class="t" x="318.0" y="64" text-anchor="middle" font-size="17" font-weight="700">!</text>
    <text class="t" x="454.0" y="65" text-anchor="middle" font-size="19" font-weight="600" letter-spacing="5">STATUS</text>
  </g>

  <text class="t dim" x="70" y="124" font-size="13" letter-spacing="3">NAME</text>
  <text class="t" x="70" y="150" font-size="22" font-weight="700">Faheem Rafiq</text>
  <text class="t dim" x="330" y="124" font-size="13" letter-spacing="3">JOB</text>
  <text class="t" x="330" y="150" font-size="22" font-weight="700">Full Stack Developer</text>
  <text class="t dim" x="640" y="124" font-size="13" letter-spacing="3">LEVEL</text>
  <text class="t acc" x="640" y="150" font-size="22" font-weight="700" filter="url(#glow)">??? <tspan class="m dim" font-size="13" font-weight="400">still leveling</tspan></text>

  <text class="t dim" x="70" y="192" font-size="13" letter-spacing="3">TITLE</text>
  <text class="t" x="70" y="216" font-size="18" font-weight="600">Bug Slayer</text>
  <text class="t dim" x="330" y="192" font-size="13" letter-spacing="3">CLASS</text>
  <text class="t" x="330" y="216" font-size="18" font-weight="600">Solo Shipper</text>
  <text class="t dim" x="640" y="192" font-size="13" letter-spacing="3">FATIGUE</text>
  <text class="t" x="640" y="216" font-size="18" font-weight="600">0 <tspan class="m dim" font-size="13" font-weight="400">after chai</tspan></text>

  <rect x="56" y="244" width="768" height="1.2" fill="url(#bar)" opacity=".7"/>

  <text class="t" x="70" y="300" font-size="15" font-weight="700" letter-spacing="2">STRENGTH</text>
  <text class="m dim" x="235" y="300" font-size="13">Laravel · PHP</text>
  <rect x="470" y="288" width="300" height="10" fill="#0d2147" stroke="#4cc9ff" stroke-opacity=".35"/>
  <rect class="g0" x="470" y="288" width="288" height="10" fill="#4cc9ff" filter="url(#glow)"/>
  <text class="m acc" x="810" y="300" text-anchor="end" font-size="15" font-weight="700">96</text>
  <text class="t" x="70" y="338" font-size="15" font-weight="700" letter-spacing="2">AGILITY</text>
  <text class="m dim" x="235" y="338" font-size="13">React · Vue · Inertia</text>
  <rect x="470" y="326" width="300" height="10" fill="#0d2147" stroke="#4cc9ff" stroke-opacity=".35"/>
  <rect class="g1" x="470" y="326" width="273" height="10" fill="#4cc9ff" filter="url(#glow)"/>
  <text class="m acc" x="810" y="338" text-anchor="end" font-size="15" font-weight="700">91</text>
  <text class="t" x="70" y="376" font-size="15" font-weight="700" letter-spacing="2">INTELLIGENCE</text>
  <text class="m dim" x="235" y="376" font-size="13">MySQL · PostgreSQL</text>
  <rect x="470" y="364" width="300" height="10" fill="#0d2147" stroke="#4cc9ff" stroke-opacity=".35"/>
  <rect class="g2" x="470" y="364" width="264" height="10" fill="#4cc9ff" filter="url(#glow)"/>
  <text class="m acc" x="810" y="376" text-anchor="end" font-size="15" font-weight="700">88</text>
  <text class="t" x="70" y="414" font-size="15" font-weight="700" letter-spacing="2">VITALITY</text>
  <text class="m dim" x="235" y="414" font-size="13">AWS · Linux · Docker</text>
  <rect x="470" y="402" width="300" height="10" fill="#0d2147" stroke="#4cc9ff" stroke-opacity=".35"/>
  <rect class="g3" x="470" y="402" width="246" height="10" fill="#4cc9ff" filter="url(#glow)"/>
  <text class="m acc" x="810" y="414" text-anchor="end" font-size="15" font-weight="700">82</text>
  <text class="t" x="70" y="452" font-size="15" font-weight="700" letter-spacing="2">SENSE</text>
  <text class="m dim" x="235" y="452" font-size="13">Go · Security tooling</text>
  <rect x="470" y="440" width="300" height="10" fill="#0d2147" stroke="#4cc9ff" stroke-opacity=".35"/>
  <rect class="g4" x="470" y="440" width="255" height="10" fill="#4cc9ff" filter="url(#glow)"/>
  <text class="m acc" x="810" y="452" text-anchor="end" font-size="15" font-weight="700">85</text>
  <rect x="56" y="476" width="768" height="1.2" fill="url(#bar)" opacity=".7"/>
  <text class="m dim" x="440.0" y="504" text-anchor="middle" font-size="13">Available ability points: <tspan class="acc" font-weight="700">0</tspan>  (all spent on side projects)</text>

</svg>
