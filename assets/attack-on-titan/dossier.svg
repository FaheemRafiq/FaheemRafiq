<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 630" width="880" height="630" role="img" aria-label="Soldier record: Faheem Rafiq">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".035 .05" numOctaves="4" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .42  0 0 0 0 .30  0 0 0 0 .14  0 0 0 .55 -.12"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .2  0 0 0 0 .14  0 0 0 0 .06  0 0 0 .22 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75">
      <stop offset=".6" stop-color="#5a3d1a" stop-opacity="0"/><stop offset="1" stop-color="#5a3d1a" stop-opacity=".5"/>
    </radialGradient>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
    <filter id="ds" x="-5%" y="-5%" width="110%" height="112%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <style>
    .tw { font-family: 'Courier New',Courier,'Liberation Mono',monospace; fill: #2b2118; }
