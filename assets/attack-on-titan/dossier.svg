    .lbl { font-family: Georgia,'Times New Roman',Times,serif; font-size: 12px; letter-spacing: 3px; fill: #6b4a24; }
    .hd { font-family: Georgia,'Times New Roman',Times,serif; fill: #2b2118; letter-spacing: 6px; font-weight: 700; }
    .tk { animation: ink .5s ease-out both; }
    .stamp { transform-box: fill-box; transform-origin: center; animation: stamp .7s 1.4s cubic-bezier(.2,1.6,.4,1) both; }
    @keyframes ink { from { opacity: 0 } to { opacity: 1 } }
    @keyframes stamp { 0% { opacity: 0; transform: scale(2.2) } 100% { opacity: 1; transform: scale(1) } }
  </style>
