<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="880" height="210" role="img" aria-label="Expeditions beyond the Walls">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".03 .06" numOctaves="4" seed="23" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .42  0 0 0 0 .30  0 0 0 0 .14  0 0 0 .6 -.14"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <radialGradient id="vig" cx=".5" cy=".5" r=".8"><stop offset=".55" stop-color="#5a3d1a" stop-opacity="0"/><stop offset="1" stop-color="#5a3d1a" stop-opacity=".55"/></radialGradient>
  </defs>
  <style>
    .hd { font-family: Georgia,'Times New Roman',Times,serif; fill: #2b2118; font-weight: 700; letter-spacing: 5px; }
    .tw { font-family: 'Courier New',Courier,'Liberation Mono',monospace; fill: #2b2118; }
    .wl { font-family: Georgia,'Times New Roman',Times,serif; font-size: 10px; letter-spacing: 2px; fill: #6b4a24; }
    .route { stroke-dasharray: 7 6; animation: march 1.2s linear infinite; }
    .flare { animation: flare 3.2s ease-out infinite; transform-box: fill-box; transform-origin: bottom; }
    .ping { animation: ping 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes march { to { stroke-dashoffset: -26 } }
    @keyframes flare { 0% { transform: scaleY(0); opacity: 0 } 30% { opacity: .9 } 100% { transform: scaleY(1); opacity: 0 } }
    @keyframes ping { 0% { transform: scale(.4); opacity: .9 } 100% { transform: scale(2.2); opacity: 0 } }
  </style>
  <rect x="6" y="6" width="868" height="198" rx="4" fill="#e4d3ad"/>
  <rect x="6" y="6" width="868" height="198" rx="4" fill="#fff" filter="url(#paper)"/>
  <rect x="6" y="6" width="868" height="198" rx="4" fill="url(#vig)"/>
  <rect x="16" y="16" width="848" height="178" fill="none" stroke="#2b2118" stroke-opacity=".6" stroke-width="1.4"/>
  <clipPath id="mapclip"><rect x="16" y="16" width="848" height="178"/></clipPath>
  <g clip-path="url(#mapclip)">
    <circle cx="190" cy="105" r="118" fill="none" stroke="#2b2118" stroke-width="3" stroke-opacity=".8"/>
    <circle cx="190" cy="105" r="78" fill="none" stroke="#2b2118" stroke-width="2.4" stroke-opacity=".75"/>
    <circle cx="190" cy="105" r="40" fill="#b99e68" fill-opacity=".35" stroke="#2b2118" stroke-width="2"/>
    <circle cx="190" cy="105" r="5" fill="#2b2118"/>
    <text class="wl" x="190" y="89" text-anchor="middle">SINA</text>
    <text class="wl" x="190" y="49" text-anchor="middle">ROSE</text>
    <text class="wl" x="252" y="175" text-anchor="middle">MARIA</text>
    <path class="route" d="M190,105 C250,75 300,143 360,111 S440,53 490,87" fill="none" stroke="#a3231c" stroke-width="2.6"/>
    <circle class="ping" cx="490" cy="87" r="9" fill="none" stroke="#a3231c" stroke-width="2"/>
    <path d="M483,80 l14,14 M497,80 l-14,14" stroke="#a3231c" stroke-width="3" stroke-linecap="round"/>
    <path class="flare" d="M360,111 q-8,-40 4,-78" fill="none" stroke="#3e7a45" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text class="hd" x="530" y="84" font-size="21" style="letter-spacing:4px">EXPEDITIONS</text>
  <text class="hd" x="530" y="114" font-size="21" style="letter-spacing:4px">BEYOND THE WALLS</text>
  <path d="M530,130 H838" stroke="#2b2118" stroke-width="1.6"/>
  <text class="tw" x="530" y="152" font-size="13">Four sorties outside Wall Prod.</text>
  <text class="tw" x="530" y="171" font-size="13">All squads returned. Mostly.</text>
</svg>
