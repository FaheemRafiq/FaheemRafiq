        </g>
        <path d="M364,160 q34,-16 66,0 M490,160 q32,-16 66,0" fill="none" stroke="#3a241d" stroke-width="5" stroke-linecap="round"/>
        <path d="M455,206 q-10,26 6,30" fill="none" stroke="#4a1d16" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <ellipse class="steam" cx="360" cy="220" rx="26" ry="18" style="animation-delay:-0.0s"/><ellipse class="steam" cx="420" cy="220" rx="34" ry="24" style="animation-delay:-1.3s"/><ellipse class="steam" cx="500" cy="220" rx="30" ry="21" style="animation-delay:-2.6s"/><ellipse class="steam" cx="560" cy="220" rx="24" ry="17" style="animation-delay:-0.7s"/><ellipse class="steam" cx="455" cy="220" rx="22" ry="15" style="animation-delay:-3.4s"/><ellipse class="steam" cx="310" cy="220" rx="20" ry="14" style="animation-delay:-2.0s"/><ellipse class="steam" cx="610" cy="220" rx="20" ry="14" style="animation-delay:-3.9s"/>
    </g>

