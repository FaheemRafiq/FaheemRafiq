<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Titan sighting report: legacy code is peeking over Wall Prod">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a2a"/><stop offset=".55" stop-color="#8a4a32"/><stop offset="1" stop-color="#d9995a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c06a50"/><stop offset="1" stop-color="#8f3f31"/></linearGradient>
    <linearGradient id="wallshade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="ds"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".6"/></filter>
  </defs>
  <style>
    .hd { font-family: Georgia,'Times New Roman',Times,serif; font-weight: 700; letter-spacing: 5px; fill: #f1e6c8; }
    .tw { font-family: 'Courier New',Courier,'Liberation Mono',monospace; fill: #f1e6c8; }
    .tag { font-family: 'Courier New',Courier,'Liberation Mono',monospace; font-size: 13px; fill: #2b2118; font-weight: 700; }
    .titan { animation: peek 9s ease-in-out infinite; }
    .lid { animation: blink 5s infinite; transform-box: fill-box; transform-origin: top; }
    .pupil { animation: look 9s ease-in-out infinite; }
    .steam { fill: #f3e4d2; opacity: 0; filter: url(#blur); animation: steam 4.6s ease-out infinite; }
    .alarm { animation: alarm 1s steps(2, start) infinite; }
    .flag { animation: wave 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: left; }
    @keyframes peek { 0%,100% { transform: translateY(95px) } 30%,75% { transform: translateY(0) } }
    @keyframes blink { 0%,46%,54%,100% { transform: scaleY(0) } 50% { transform: scaleY(1) } }
    @keyframes look { 0%,30%,100% { transform: translateX(0) } 45%,60% { transform: translateX(-9px) } }
    @keyframes steam { 0% { transform: translateY(0) scale(.6); opacity: 0 } 25% { opacity: .6 } 100% { transform: translateY(-120px) scale(1.7); opacity: 0 } }
    @keyframes alarm { to { visibility: hidden } }
    @keyframes wave { 0%,100% { transform: skewY(0deg) } 50% { transform: skewY(-7deg) } }
  </style>
  <clipPath id="frame"><rect width="880" height="470" rx="10"/></clipPath>
  <g clip-path="url(#frame)">
    <rect width="880" height="470" fill="url(#sky)"/>
    <circle cx="700" cy="215" r="60" fill="#f0b267" opacity=".5" filter="url(#blur)"/>

    <clipPath id="above"><rect x="0" y="0" width="880" height="250"/></clipPath>
    <g clip-path="url(#above)">
      <g class="titan">
        <path d="M300,290 C292,150 350,92 460,92 C570,92 628,150 620,290Z" fill="url(#skin)" stroke="#4a1d16" stroke-width="3"/>
        <path d="M322,190 C340,128 400,104 460,104 C520,104 580,128 598,190 C560,150 520,140 460,140 C400,140 360,150 322,190Z" fill="#3a241d"/>
