    <text class="tw" x="440.0" y="382" text-anchor="middle" font-size="16" font-weight="700" filter="url(#ds)">On that day, the dev team received a grim reminder:</text>
    <text class="tw" x="440.0" y="408" text-anchor="middle" font-size="16" filter="url(#ds)">the legacy code was never dead. It was only undocumented.</text>
    <text class="tw" x="440.0" y="442" text-anchor="middle" font-size="12.5" opacity=".8" filter="url(#ds)">Recommended action: do not make eye contact. Open a ticket. Retreat behind Wall Staging.</text>
