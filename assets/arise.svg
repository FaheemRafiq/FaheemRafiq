<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-label="Arise">
  <defs>
    <radialGradient id="aura" cx=".5" cy=".55" r=".6">
      <stop offset="0" stop-color="#5a2bd6" stop-opacity=".75"/>
      <stop offset=".55" stop-color="#1b0b4a" stop-opacity=".7"/>
      <stop offset="1" stop-color="#05030f"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a06bff" stop-opacity="0"/><stop offset=".5" stop-color="#a06bff"/><stop offset="1" stop-color="#a06bff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .a { font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight: 900; fill: #f1e9ff; animation: breathe 3.5s ease-in-out infinite; }
    .s { font-family: 'Fira Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; fill: #b9a3e8; }
    .p { fill: #a06bff; animation: rise 4s linear infinite; }
    @keyframes breathe { 0%,100% { opacity: .8; letter-spacing: 26px } 50% { opacity: 1; letter-spacing: 30px } }
    @keyframes rise { from { transform: translateY(0); opacity: .9 } to { transform: translateY(-170px); opacity: 0 } }
  </style>
  <rect width="880" height="200" fill="#05030f"/>
  <rect width="880" height="200" fill="url(#aura)"/>
  <circle class="p" cx="60" cy="190" r="1.5" style="animation-delay:0.00s"/><circle class="p" cx="157" cy="203" r="2.5" style="animation-delay:3.63s"/><circle class="p" cx="254" cy="196" r="3.5" style="animation-delay:3.26s"/><circle class="p" cx="351" cy="209" r="1.5" style="animation-delay:2.89s"/><circle class="p" cx="448" cy="202" r="2.5" style="animation-delay:2.52s"/><circle class="p" cx="545" cy="195" r="3.5" style="animation-delay:2.15s"/><circle class="p" cx="642" cy="208" r="1.5" style="animation-delay:1.78s"/><circle class="p" cx="739" cy="201" r="2.5" style="animation-delay:1.41s"/><circle class="p" cx="836" cy="194" r="3.5" style="animation-delay:1.04s"/><circle class="p" cx="153" cy="207" r="1.5" style="animation-delay:0.67s"/><circle class="p" cx="250" cy="200" r="2.5" style="animation-delay:0.30s"/><circle class="p" cx="347" cy="193" r="3.5" style="animation-delay:3.93s"/><circle class="p" cx="444" cy="206" r="1.5" style="animation-delay:3.56s"/><circle class="p" cx="541" cy="199" r="2.5" style="animation-delay:3.19s"/><circle class="p" cx="638" cy="192" r="3.5" style="animation-delay:2.82s"/><circle class="p" cx="735" cy="205" r="1.5" style="animation-delay:2.45s"/><circle class="p" cx="832" cy="198" r="2.5" style="animation-delay:2.08s"/><circle class="p" cx="149" cy="191" r="3.5" style="animation-delay:1.71s"/><circle class="p" cx="246" cy="204" r="1.5" style="animation-delay:1.34s"/><circle class="p" cx="343" cy="197" r="2.5" style="animation-delay:0.97s"/><circle class="p" cx="440" cy="190" r="3.5" style="animation-delay:0.60s"/><circle class="p" cx="537" cy="203" r="1.5" style="animation-delay:0.23s"/>
  <rect x="0" y="0" width="880" height="3" fill="url(#bar)"/>
  <rect x="0" y="197" width="880" height="3" fill="url(#bar)"/>
  <text class="a" x="454.0" y="122" text-anchor="middle" font-size="84" filter="url(#glow)" letter-spacing="28">ARISE</text>
  <text class="s" x="440.0" y="166" text-anchor="middle" font-size="14" letter-spacing="3">SHADOW EXTRACTION · the projects that answered the call</text>
