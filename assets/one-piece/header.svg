<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="Faheem Rafiq, Full Stack Developer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a8fd6"/><stop offset=".6" stop-color="#8fd3f4"/><stop offset="1" stop-color="#fde9b6"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6c9"/><stop offset=".45" stop-color="#ffe27a" stop-opacity=".9"/><stop offset="1" stop-color="#ffe27a" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="880" height="330" rx="14"/></clipPath>
  </defs>
  <style>
    .cloud { fill: #fff; animation: drift linear infinite; }
    .w1 { animation: roll 7s linear infinite; } .w2 { animation: roll 11s linear infinite reverse; } .w3 { animation: roll 16s linear infinite; }
    .ship { animation: bob 4.5s ease-in-out infinite; transform-origin: 790px 250px; }
    .flag { animation: sway 5s ease-in-out infinite; transform-origin: 150px 150px; }
    .rays { animation: spin 60s linear infinite; transform-origin: 150px 150px; }
    @keyframes drift { from { transform: translateX(-140px) } to { transform: translateX(1020px) } }
    @keyframes roll { from { transform: translateX(0) } to { transform: translateX(160px) } }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2.5deg) } 50% { transform: translateY(-7px) rotate(2.5deg) } }
    @keyframes sway { 0%,100% { transform: rotate(-3deg) } 50% { transform: rotate(3deg) } }
    @keyframes spin { to { transform: rotate(360deg) } }
  </style>
