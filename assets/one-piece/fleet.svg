<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" role="img" aria-label="The Fleet">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .35  0 0 0 0 .22  0 0 0 0 .08  0 0 0 .55 -.12" result="t"/>
      <feComposite in="t" in2="SourceGraphic" operator="in" result="tt"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="tt"/></feMerge>
    </filter>
    <radialGradient id="burn" cx=".5" cy=".5" r=".75">
      <stop offset=".55" stop-color="#7a4a16" stop-opacity="0"/>
      <stop offset="1" stop-color="#5b3410" stop-opacity=".55"/>
    </radialGradient></defs>
  <style>
    .route { stroke-dasharray: 10 9; animation: march 1.6s linear infinite; }
    .rose { animation: spin 40s linear infinite; transform-origin: 770px 115px; }
    .needle { animation: wob 3s ease-in-out infinite; transform-origin: 770px 115px; }
    .x { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .boat { animation: sail 14s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -38 } }
    @keyframes spin { to { transform: rotate(360deg) } }
    @keyframes wob { 0%,100% { transform: rotate(-12deg) } 50% { transform: rotate(14deg) } }
    @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.25) } }
    @keyframes sail { 0% { offset-distance: 0% } 100% { offset-distance: 100% } }
  </style>
  <g filter="url(#paper)"><path d="M6 10 l10 -6 h848 l10 8 v204 l-8 8 h-852 l-8 -10z" fill="#efdcae"/></g>
  <path d="M6 10 l10 -6 h848 l10 8 v204 l-8 8 h-852 l-8 -10z" fill="url(#burn)"/>
  <path d="M6 10 l10 -6 h848 l10 8 v204 l-8 8 h-852 l-8 -10z" fill="none" stroke="#3b2413" stroke-width="2.5"/>
  <g fill="#c9a968" stroke="#3b2413" stroke-width="2" stroke-linejoin="round">
    <path d="M60 150 q10 -34 44 -30 q20 -22 44 -2 q26 6 14 30 q-30 18 -70 12 q-26 2 -32 -10z"/>
    <path d="M330 60 q24 -22 52 -6 q22 10 6 26 q-30 12 -54 2 q-14 -10 -4 -22z"/>
    <path d="M520 168 q16 -26 46 -16 q30 -6 30 16 q-18 20 -52 14 q-20 0 -24 -14z"/>
  </g>
  <g fill="none" stroke="#3b2413" stroke-width="1.6"><path d="M96 128 l10 -18 l10 18 M114 132 l8 -14 l8 14"/><path d="M350 62 l8 -14 l8 14"/><path d="M548 164 l9 -15 l9 15"/></g>
  <path id="rt" class="route" d="M120 150 C200 60 260 190 356 70 S480 210 556 168 S650 60 700 96" fill="none" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/>
  <g class="x" stroke="#b3261e" stroke-width="6" stroke-linecap="round"><path d="M690 86 l20 20 M710 86 l-20 20"/></g>
  <g class="boat" style="offset-path: path('M120 150 C200 60 260 190 356 70 S480 210 556 168 S650 60 700 96'); offset-rotate: 0deg">
    <path d="M-13 2 h26 l-5 9 h-16z" fill="#8a4b1c" stroke="#3b2413" stroke-width="1.8"/><path d="M0 2 v-22 q16 6 12 20z" fill="#fff8e3" stroke="#3b2413" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
  <g>
    <circle cx="770" cy="115" r="58" fill="#f6e7bf" stroke="#3b2413" stroke-width="2.5"/>
    <g class="rose" stroke="#3b2413" stroke-width="1.5"><line x1="770" y1="62" x2="770" y2="68" transform="rotate(0.0 770 115)"/><line x1="770" y1="62" x2="770" y2="72" transform="rotate(22.5 770 115)"/><line x1="770" y1="62" x2="770" y2="68" transform="rotate(45.0 770 115)"/><line x1="770" y1="62" x2="770" y2="72" transform="rotate(67.5 770 115)"/><line x1="770" y1="62" x2="770" y2="68" transform="rotate(90.0 770 115)"/><line x1="770" y1="62" x2="770" y2="72" transform="rotate(112.5 770 115)"/><line x1="770" y1="62" x2="770" y2="68" transform="rotate(135.0 770 115)"/><line x1="770" y1="62" x2="770" y2="72" transform="rotate(157.5 770 115)"/><line x1="770" y1="62" x2="770" y2="68" transform="rotate(180.0 770 115)"/><line x1="770" y1="62" x2="770" y2="72" transform="rotate(202.5 770 115)"/><line x1="770" y1="62" x2="770" y2="68" transform="rotate(225.0 770 115)"/><line x1="770" y1="62" x2="770" y2="72" transform="rotate(247.5 770 115)"/><line x1="770" y1="62" x2="770" y2="68" transform="rotate(270.0 770 115)"/><line x1="770" y1="62" x2="770" y2="72" transform="rotate(292.5 770 115)"/><line x1="770" y1="62" x2="770" y2="68" transform="rotate(315.0 770 115)"/><line x1="770" y1="62" x2="770" y2="72" transform="rotate(337.5 770 115)"/></g>
    <g class="needle"><path d="M770 70 l9 45 h-18z" fill="#b3261e" stroke="#3b2413" stroke-width="1.5"/><path d="M770 160 l9 -45 h-18z" fill="#fff8e3" stroke="#3b2413" stroke-width="1.5"/></g>
    <circle cx="770" cy="115" r="5" fill="#3b2413"/>
    <text x="770" y="50" text-anchor="middle" font-family="'Rockwell','Roboto Slab','Rockwell Nova',Georgia,'Times New Roman',serif" font-size="13" font-weight="900" fill="#3b2413">N</text>
  </g>
  <rect x="300" y="88" width="330" height="62" fill="#efdcae" opacity=".82"/>
  <text x="465" y="130" text-anchor="middle" font-family="'Rockwell','Roboto Slab','Rockwell Nova',Georgia,'Times New Roman',serif" font-size="44" font-weight="900" letter-spacing="8" fill="#3b2413">THE FLEET</text>
  <text x="465" y="204" text-anchor="middle" font-family="Georgia,'Times New Roman',Times,serif" font-style="italic" font-size="15" fill="#3b2413">Every ship here was built, launched and sailed by the captain.</text>
</svg>
