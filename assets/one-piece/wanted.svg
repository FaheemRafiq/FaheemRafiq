<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" role="img" aria-label="Wanted poster: Faheem Rafiq, dead or alive">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .35  0 0 0 0 .22  0 0 0 0 .08  0 0 0 .55 -.12" result="t"/>
      <feComposite in="t" in2="SourceGraphic" operator="in" result="tt"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="tt"/></feMerge>
    </filter>
    <radialGradient id="burn" cx=".5" cy=".5" r=".75">
      <stop offset=".55" stop-color="#7a4a16" stop-opacity="0"/>
      <stop offset="1" stop-color="#5b3410" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="psky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb7d6"/><stop offset="1" stop-color="#e9d6a2"/></linearGradient>
    <clipPath id="ph"><rect x="34" y="96" width="292" height="232"/></clipPath>
    <clipPath id="c"><rect width="880" height="600" rx="14"/></clipPath>
    <filter id="sh" x="-10%" y="-10%" width="125%" height="125%"><feDropShadow dx="5" dy="8" stdDeviation="6" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <style>
    .poster { animation: swing 6s ease-in-out infinite; transform-origin: 232px 34px; }
    .b { transform-box: fill-box; transform-origin: left; animation: grow 1.8s cubic-bezier(.2,.8,.2,1) both; }
    .b0 { animation-delay: 0.0s } .b1 { animation-delay: 0.2s } .b2 { animation-delay: 0.4s } .b3 { animation-delay: 0.6s } .b4 { animation-delay: 0.8s } 
    .stamp { animation: stamp 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .sea { animation: roll 6s linear infinite; }
    @keyframes swing { 0%,100% { transform: rotate(-3.2deg) } 50% { transform: rotate(-1.2deg) } }
    @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    @keyframes stamp { 0%,100% { opacity: .78 } 50% { opacity: .95 } }
    @keyframes roll { from { transform: translateX(0) } to { transform: translateX(60px) } }
  </style>
  <g clip-path="url(#c)"><rect x="0" y="0" width="880" height="75" fill="#63401f"/><line x1="0" y1="0" x2="880" y2="0" stroke="#2c180a" stroke-width="3"/><rect x="0" y="75" width="880" height="75" fill="#5a371c"/><line x1="0" y1="75" x2="880" y2="75" stroke="#2c180a" stroke-width="3"/><rect x="0" y="150" width="880" height="75" fill="#63401f"/><line x1="0" y1="150" x2="880" y2="150" stroke="#2c180a" stroke-width="3"/><rect x="0" y="225" width="880" height="75" fill="#5a371c"/><line x1="0" y1="225" x2="880" y2="225" stroke="#2c180a" stroke-width="3"/><rect x="0" y="300" width="880" height="75" fill="#63401f"/><line x1="0" y1="300" x2="880" y2="300" stroke="#2c180a" stroke-width="3"/><rect x="0" y="375" width="880" height="75" fill="#5a371c"/><line x1="0" y1="375" x2="880" y2="375" stroke="#2c180a" stroke-width="3"/><rect x="0" y="450" width="880" height="75" fill="#63401f"/><line x1="0" y1="450" x2="880" y2="450" stroke="#2c180a" stroke-width="3"/><rect x="0" y="525" width="880" height="75" fill="#5a371c"/><line x1="0" y1="525" x2="880" y2="525" stroke="#2c180a" stroke-width="3"/><ellipse cx="60" cy="40" rx="14" ry="6" fill="none" stroke="#3a2210" stroke-width="2" opacity=".6"/><ellipse cx="840" cy="190" rx="14" ry="6" fill="none" stroke="#3a2210" stroke-width="2" opacity=".6"/><ellipse cx="430" cy="560" rx="14" ry="6" fill="none" stroke="#3a2210" stroke-width="2" opacity=".6"/><ellipse cx="820" cy="500" rx="14" ry="6" fill="none" stroke="#3a2210" stroke-width="2" opacity=".6"/><ellipse cx="30" cy="330" rx="14" ry="6" fill="none" stroke="#3a2210" stroke-width="2" opacity=".6"/></g>
  <rect x="1.5" y="1.5" width="877" height="597" rx="13" fill="none" stroke="#2c180a" stroke-width="3"/>

  <!-- wanted poster -->
  <g class="poster" filter="url(#sh)">
    <g transform="translate(52 34)">
      <g filter="url(#paper)">
        <path d="M0 4 l8 -4 h340 l12 6 v518 l-10 6 h-338 l-12 -8z" fill="#efdcae"/>
      </g>
      <path d="M0 4 l8 -4 h340 l12 6 v518 l-10 6 h-338 l-12 -8z" fill="url(#burn)"/>
      <text x="180" y="78" text-anchor="middle" font-family="'Rockwell','Roboto Slab','Rockwell Nova',Georgia,'Times New Roman',serif" font-size="76" font-weight="900" letter-spacing="4" fill="#3b2413" textLength="300" lengthAdjust="spacingAndGlyphs">WANTED</text>
      <rect x="34" y="96" width="292" height="232" fill="url(#psky)"/>
      <g clip-path="url(#ph)">
        <circle cx="262" cy="150" r="30" fill="#fff3c4" opacity=".9"/>
        <path class="sea" d="M-60 286 q15 -10 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 V340 H-60z" fill="#3f7fa6"/>
        <!-- the pirate: a dev in a straw hat -->
        <path d="M70 340 c0 -62 40 -84 110 -84 s110 22 110 84z" fill="#7d1f1a" stroke="#3b2413" stroke-width="3"/>
        <path d="M150 262 l30 44 l30 -44z" fill="#e2b48a" stroke="#3b2413" stroke-width="3" stroke-linejoin="round"/>
        <rect x="160" y="222" width="40" height="44" fill="#e2b48a" stroke="#3b2413" stroke-width="3"/>
        <ellipse cx="180" cy="196" rx="50" ry="54" fill="#eec39a" stroke="#3b2413" stroke-width="3"/>
        <path d="M150 208 q30 34 60 0" fill="#fff" stroke="#3b2413" stroke-width="3" stroke-linejoin="round"/>
        <path d="M150 208 h60" stroke="#3b2413" stroke-width="2"/>
        <circle cx="161" cy="186" r="5" fill="#3b2413"/><circle cx="199" cy="186" r="5" fill="#3b2413"/>
        <path d="M166 201 q-6 5 -1 12" fill="none" stroke="#3b2413" stroke-width="2"/>
        <path d="M130 170 q8 -22 22 -14 q-6 6 -6 18z M230 170 q-8 -22 -22 -14 q6 6 6 18z" fill="#3b2413"/>
        <ellipse cx="180" cy="158" rx="104" ry="20" fill="#f2c94c" stroke="#3b2413" stroke-width="3"/>
        <path d="M124 156 c0 -62 112 -62 112 0 c-30 10 -82 10 -112 0z" fill="#f2c94c" stroke="#3b2413" stroke-width="3" stroke-linejoin="round"/>
        <path d="M124 154 c30 10 82 10 112 0 l0 -14 c-30 10 -82 10 -112 0z" fill="#b3261e" stroke="#3b2413" stroke-width="3" stroke-linejoin="round"/>
        <!-- laptop -->
        <path d="M118 300 h124 l10 40 h-144z" fill="#2b2b33" stroke="#3b2413" stroke-width="3" stroke-linejoin="round"/>
        <text x="180" y="328" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#f2c94c">&lt;/&gt;</text>
      </g>
      <rect x="34" y="96" width="292" height="232" fill="none" stroke="#3b2413" stroke-width="4"/>
      <text x="180" y="372" text-anchor="middle" font-family="'Rockwell','Roboto Slab','Rockwell Nova',Georgia,'Times New Roman',serif" font-size="33" font-weight="900" letter-spacing="2" fill="#3b2413" textLength="290" lengthAdjust="spacingAndGlyphs">DEAD OR ALIVE</text>
      <text x="180" y="420" text-anchor="middle" font-family="Georgia,'Times New Roman',Times,serif" font-size="38" font-weight="700" letter-spacing="1" fill="#3b2413" textLength="290" lengthAdjust="spacingAndGlyphs">FAHEEM RAFIQ</text>
      <g transform="translate(36 470)">
        <text x="0" y="0" font-family="Georgia,'Times New Roman',Times,serif" font-size="40" font-weight="700" fill="#3b2413">B</text>
        <path d="M10 -32 v38 M17 -32 v38" stroke="#3b2413" stroke-width="2.4"/>
        <text x="36" y="0" font-family="Georgia,'Times New Roman',Times,serif" font-size="38" font-weight="700" fill="#3b2413" textLength="250" lengthAdjust="spacingAndGlyphs">3,000,000,000-</text>
      </g>
      <text x="180" y="506" text-anchor="middle" font-family="'Rockwell','Roboto Slab','Rockwell Nova',Georgia,'Times New Roman',serif" font-size="24" font-weight="900" letter-spacing="14" fill="#3b2413">MARINE</text>
      <text x="180" y="522" text-anchor="middle" font-family="Georgia,'Times New Roman',Times,serif" font-size="9" letter-spacing="1.5" fill="#5b3c1e">WANTED FOR SHIPPING ON A FRIDAY</text>
    </g>
    <circle cx="232" cy="34" r="7" fill="#c9c9c9" stroke="#2c180a" stroke-width="2"/>
  </g>

  <!-- pirate record -->
  <g transform="translate(456 40)" filter="url(#sh)">
    <g filter="url(#paper)"><path d="M0 0 h388 l4 8 v506 l-6 6 h-380 l-6 -6z" fill="#efdcae"/></g>
    <path d="M0 0 h388 l4 8 v506 l-6 6 h-380 l-6 -6z" fill="url(#burn)"/>
    <g transform="translate(21 0)">
      <text x="175" y="46" text-anchor="middle" font-family="'Rockwell','Roboto Slab','Rockwell Nova',Georgia,'Times New Roman',serif" font-size="26" font-weight="900" letter-spacing="5" fill="#3b2413">PIRATE RECORD</text>
      <path d="M0 60 h350 M0 65 h350" stroke="#3b2413" stroke-width="1.5"/>
      <g font-family="'Rockwell','Roboto Slab','Rockwell Nova',Georgia,'Times New Roman',serif" font-size="11.5" letter-spacing="2.5" fill="#6b4a2a">
        <text x="0" y="92">NAME</text><text x="190" y="92">POSITION</text>
        <text x="0" y="150">EPITHET</text><text x="190" y="150">DEVIL FRUIT</text>
        <text x="0" y="208">CREW</text><text x="190" y="208">DREAM</text>
      </g>
      <g font-family="Georgia,'Times New Roman',Times,serif" font-size="19" font-weight="700" fill="#3b2413">
        <text x="0" y="116">Faheem Rafiq</text><text x="190" y="116">Full Stack Dev</text>
        <text x="0" y="174">"Bug Slayer"</text><text x="190" y="174">Stack-Stack Fruit</text>
        <text x="0" y="232">Solo Shippers</text><text x="190" y="232">King of the Stack</text>
      </g>
      <path d="M0 256 h350" stroke="#3b2413" stroke-width="1.5" stroke-dasharray="6 5"/>
      <text x="175" y="288" text-anchor="middle" font-family="'Rockwell','Roboto Slab','Rockwell Nova',Georgia,'Times New Roman',serif" font-size="14" font-weight="900" letter-spacing="5" fill="#b3261e">— POWERS —</text>
      
      <text x="0" y="318" font-family="'Rockwell','Roboto Slab','Rockwell Nova',Georgia,'Times New Roman',serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#3b2413">ARMAMENT HAKI</text>
      <text x="350" y="318" text-anchor="end" font-family="Georgia,'Times New Roman',Times,serif" font-style="italic" font-size="13.5" fill="#6b4a2a">Laravel · PHP</text>
      <rect x="0" y="326" width="350" height="9" rx="4.5" fill="#d9bf86" stroke="#3b2413" stroke-width="1.2"/>
      <rect class="b b0" x="0" y="326" width="336" height="9" rx="4.5" fill="#b3261e"/>
      <text x="0" y="366" font-family="'Rockwell','Roboto Slab','Rockwell Nova',Georgia,'Times New Roman',serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#3b2413">OBSERVATION HAKI</text>
      <text x="350" y="366" text-anchor="end" font-family="Georgia,'Times New Roman',Times,serif" font-style="italic" font-size="13.5" fill="#6b4a2a">React · Vue · Inertia</text>
      <rect x="0" y="374" width="350" height="9" rx="4.5" fill="#d9bf86" stroke="#3b2413" stroke-width="1.2"/>
      <rect class="b b1" x="0" y="374" width="318" height="9" rx="4.5" fill="#b3261e"/>
      <text x="0" y="414" font-family="'Rockwell','Roboto Slab','Rockwell Nova',Georgia,'Times New Roman',serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#3b2413">CONQUEROR'S HAKI</text>
      <text x="350" y="414" text-anchor="end" font-family="Georgia,'Times New Roman',Times,serif" font-style="italic" font-size="13.5" fill="#6b4a2a">MySQL · PostgreSQL</text>
      <rect x="0" y="422" width="350" height="9" rx="4.5" fill="#d9bf86" stroke="#3b2413" stroke-width="1.2"/>
      <rect class="b b2" x="0" y="422" width="308" height="9" rx="4.5" fill="#b3261e"/>
      <text x="0" y="462" font-family="'Rockwell','Roboto Slab','Rockwell Nova',Georgia,'Times New Roman',serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#3b2413">SEA LEGS</text>
      <text x="350" y="462" text-anchor="end" font-family="Georgia,'Times New Roman',Times,serif" font-style="italic" font-size="13.5" fill="#6b4a2a">AWS · Linux · Docker</text>
      <rect x="0" y="470" width="350" height="9" rx="4.5" fill="#d9bf86" stroke="#3b2413" stroke-width="1.2"/>
      <rect class="b b3" x="0" y="470" width="287" height="9" rx="4.5" fill="#b3261e"/>
      <text x="0" y="510" font-family="'Rockwell','Roboto Slab','Rockwell Nova',Georgia,'Times New Roman',serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#3b2413">SWORDSMANSHIP</text>
      <text x="350" y="510" text-anchor="end" font-family="Georgia,'Times New Roman',Times,serif" font-style="italic" font-size="13.5" fill="#6b4a2a">Go · Security tooling</text>
      <rect x="0" y="518" width="350" height="9" rx="4.5" fill="#d9bf86" stroke="#3b2413" stroke-width="1.2"/>
      <rect class="b b4" x="0" y="518" width="298" height="9" rx="4.5" fill="#b3261e"/>
      <g class="stamp" transform="translate(300 276) rotate(-12)">
        <rect x="-48" y="-16" width="96" height="32" rx="5" fill="none" stroke="#b3261e" stroke-width="3.5" opacity=".8"/>
        <text x="0" y="6" text-anchor="middle" font-family="'Rockwell','Roboto Slab','Rockwell Nova',Georgia,'Times New Roman',serif" font-size="16" font-weight="900" letter-spacing="2" fill="#b3261e" opacity=".8">YONKO</text>
      </g>
    </g>
  </g>
</svg>
